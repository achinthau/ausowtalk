;
; Asterisk's HTTP server terminates the SIP WebSocket.
;   ws://  localhost:8088/ws  — debugging only, browsers block it from https pages
;   wss:// localhost:8089/ws  — what the phone uses
;
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

tlsenable=yes
tlsbindaddr=0.0.0.0:8089
; Generated by scripts/make-certs.sh using mkcert, so the browser trusts it.
tlscertfile=/etc/asterisk/keys/asterisk.crt
tlsprivatekey=/etc/asterisk/keys/asterisk.key

; Allow the browser's Origin. Asterisk does not enforce CORS on the websocket
; upgrade, but keeping the server name generic avoids leaking the version.
servername=Auso Asterisk
sessionlimit=100
session_inactivity=30000
session_keep_alive=15000
