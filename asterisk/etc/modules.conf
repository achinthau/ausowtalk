;
; Ubuntu's Asterisk package autoloads every module it ships, which fills the log
; with errors for backends we don't have (LDAP, RADIUS, ODBC, IMAP voicemail…).
; Keep autoload on — an allowlist is fragile across Asterisk versions — and just
; decline the ones that can't work here.
;
[modules]
autoload=yes

; --- Database / directory backends we don't use -----------------------------
noload => res_config_ldap.so
noload => res_config_pgsql.so
noload => res_config_mysql.so
noload => res_config_odbc.so
noload => res_config_curl.so
noload => cdr_pgsql.so
noload => cdr_odbc.so
noload => cdr_mysql.so
noload => cdr_radius.so
noload => cdr_tds.so
noload => cel_pgsql.so
noload => cel_odbc.so
noload => cel_radius.so
noload => cel_tds.so
noload => res_odbc.so
noload => res_odbc_transaction.so

; --- Legacy channel drivers -------------------------------------------------
noload => chan_unistim.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => chan_dahdi.so
noload => chan_iax2.so
; chan_sip is superseded by chan_pjsip and would fight over port 5060.
noload => chan_sip.so

; --- Misc modules that need config we don't ship ----------------------------
noload => pbx_dundi.so
noload => res_phoneprov.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_geolocation.so
noload => res_prometheus.so
; These depend on the modules noloaded above and would fail to resolve symbols.
noload => res_pjsip_geolocation.so
noload => res_pjsip_phoneprov_provider.so
noload => chan_motif.so
noload => func_odbc.so
noload => cdr_adaptive_odbc.so
noload => res_calendar_caldav.so
noload => res_calendar_ews.so
noload => res_calendar_exchange.so
noload => res_calendar_icalendar.so
noload => res_xmpp.so
noload => res_corosync.so
noload => res_snmp.so
noload => res_pktccops.so

; IMAP voicemail double-registers the VoiceMail application against the plain
; app_voicemail; keep the plain one.
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
noload => app_voicemail_imap_asterisk.so

; --- Required for the WebRTC phone; listed so a bad noload above is obvious --
require => res_pjsip.so
require => res_pjsip_session.so
require => res_pjsip_registrar.so
require => res_pjsip_outbound_registration.so
require => res_pjsip_refer.so
require => res_pjsip_transport_websocket.so
require => res_http_websocket.so
require => res_srtp.so
require => res_rtp_asterisk.so
require => chan_pjsip.so
require => app_mixmonitor.so
require => app_dial.so
require => app_echo.so
require => app_playback.so
; Asterisk 20 provides the MusicOnHold application from res_, not app_.
require => res_musiconhold.so
require => app_system.so
require => func_channel.so
require => func_cdr.so
require => manager.so
