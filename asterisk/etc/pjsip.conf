;
; PJSIP configuration for the Auso Call Hub development PBX.
;
; The browser phone speaks SIP over a secure WebSocket (WSS) terminated by
; Asterisk's built-in HTTP server (see http.conf), then DTLS-SRTP for media.
;

[global]
type=global
user_agent=Auso Asterisk (dev)
; Browsers authenticate by username, not source IP.
endpoint_identifier_order=username,ip

;==============================================================================
; Transports
;==============================================================================

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
; Asterisk lives inside a Docker bridge network, so the address it would put in
; SDP (172.x.x.x) is unreachable from the browser on the host. Advertise the
; published loopback address instead.
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8

;==============================================================================
; Endpoint template for browser (WebRTC) agents
;==============================================================================

[webrtc-agent](!)
type=endpoint
context=auso-internal
transport=transport-wss
disallow=all
; opus first for quality; ulaw/alaw so Asterisk can bridge to a PSTN trunk
; without transcoding surprises.
allow=opus,ulaw,alaw
; webrtc=yes is the shorthand for: ICE, DTLS-SRTP, AVPF, rtcp-mux and
; asymmetric RTP — everything a browser requires.
webrtc=yes
dtls_cert_file=/etc/asterisk/keys/asterisk.crt
dtls_private_key=/etc/asterisk/keys/asterisk.key
dtls_verify=fingerprint
dtls_setup=actpass
media_encryption=dtls
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
; Without this Asterisk builds the From URI from the container's hostname, e.g.
; sip:2001@3e76ca7421a2. RFC 3261 requires a hostname label to start with a
; letter, so a strict parser (SIP.js) rejects the whole INVITE and the agent
; never sees the incoming call. Pin the domain the browser already knows.
from_domain=localhost
; Let the agent put a call on hold and complete blind/attended transfers.
allow_transfer=yes
; RFC 4733 DTMF (what RTCDTMFSender sends) with SIP INFO as a fallback.
dtmf_mode=auto
trust_id_outbound=yes
device_state_busy_at=2

[webrtc-aor](!)
type=aor
; A reload or a second browser tab shouldn't leave stale contacts behind.
max_contacts=1
remove_existing=yes
; Browsers keep the websocket alive themselves; OPTIONS pings are unnecessary
; and just add log noise.
qualify_frequency=0

;==============================================================================
; Agents 2001-2005
;
; Passwords live in dynamic/pjsip_auth.conf, which the CRM rewrites with a
; fresh short-lived password each time an agent logs in (spec §2 security note).
;==============================================================================

[2001](webrtc-agent)
type=endpoint
aors=2001
auth=2001-auth
callerid=Agent 2001 <2001>

[2001](webrtc-aor)
type=aor

[2002](webrtc-agent)
type=endpoint
aors=2002
auth=2002-auth
callerid=Agent 2002 <2002>

[2002](webrtc-aor)
type=aor

[2003](webrtc-agent)
type=endpoint
aors=2003
auth=2003-auth
callerid=Agent 2003 <2003>

[2003](webrtc-aor)
type=aor

[2004](webrtc-agent)
type=endpoint
aors=2004
auth=2004-auth
callerid=Agent 2004 <2004>

[2004](webrtc-aor)
type=aor

; 2005 is the transfer destination used throughout the spec examples.
[2005](webrtc-agent)
type=endpoint
aors=2005
auth=2005-auth
callerid=Supervisor 2005 <2005>

[2005](webrtc-aor)
type=aor

; Rotated by the CRM over AMI; checked in with defaults so the PBX also works
; standalone.
#include "/etc/asterisk/dynamic/pjsip_auth.conf"
