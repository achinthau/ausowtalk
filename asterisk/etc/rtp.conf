[general]
; Keep the published UDP range small — Docker Desktop publishes port ranges
; slowly, and 10 simultaneous calls is far more than a dev box needs.
; Must match the range published in docker-compose.yml.
rtpstart=10000
rtpend=10020

; Required for WebRTC.
icesupport=yes
; No STUN/TURN needed: both ends are on the loopback interface. For a real
; deployment behind NAT, set stunaddr= / turnaddr= here.
strictrtp=yes
probation=2
