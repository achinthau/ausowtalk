;
; AMI — used by the mock CRM to
;   * rotate the per-session SIP password (`pjsip reload`)
;   * originate simulated inbound customer calls
;
; The host port is published on 127.0.0.1 only (see docker-compose.yml), so this
; is not reachable from outside the Mac. Change the secret before using any of
; this outside a dev box.
;
[general]
enabled=yes
webenabled=no
bindaddr=0.0.0.0
port=5038
displayconnects=no
timestampevents=yes

[auso]
secret=auso-dev-ami
deny=0.0.0.0/0.0.0.0
permit=0.0.0.0/0.0.0.0
read=system,call,agent,user,cdr,dialplan,reporting
write=system,call,agent,user,originate,command,reporting
