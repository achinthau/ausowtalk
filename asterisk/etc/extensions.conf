;
; Dialplan for the Auso Call Hub development PBX.
;
; Test extensions
;   2001-2005  browser agents (2005 is the transfer target in the spec examples)
;   600        echo test — confirms two-way audio with one browser tab
;   601        music on hold — confirms one-way audio
;   9<number>  simulated PSTN customer: answers, then plays audio
;

[globals]
RECORDING_DIR=/var/spool/asterisk/recordings
; Where the CRM listens. host.docker.internal resolves to the Mac from inside
; the container on Docker Desktop.
CRM_BASE=http://host.docker.internal:8080
; Shared secret for the CDR callback; must match CDR_TOKEN in the CRM server.
CDR_TOKEN=auso-dev-cdr-token

;==============================================================================
; Hangup handler → push the CDR to the CRM (spec §10)
;==============================================================================

[auso-cdr]
exten => s,1,NoOp(Pushing CDR for ${UNIQUEID} to the CRM)
 same => n,Set(REC=${IF($[${LEN(${AUSO_RECORDING})}]?${AUSO_RECORDING}:)})
 ; -G + --data-urlencode so timestamps (which contain a space) and any other
 ; awkward values are encoded properly instead of producing a malformed URL.
 same => n,System(curl -s -m 2 -o /dev/null -G "${CRM_BASE}/api/asterisk/cdr" --data-urlencode "token=${CDR_TOKEN}" --data-urlencode "call_id=${UNIQUEID}" --data-urlencode "linkedid=${CDR(linkedid)}" --data-urlencode "src=${CALLERID(num)}" --data-urlencode "dst=${AUSO_DEST}" --data-urlencode "disposition=${CDR(disposition)}" --data-urlencode "duration=${CDR(duration)}" --data-urlencode "billsec=${CDR(billsec)}" --data-urlencode "recording=${REC}" --data-urlencode "start=${CDR(start)}" --data-urlencode "end=${CDR(end)}")
 same => n,Return()

;==============================================================================
; Internal / agent context
;==============================================================================

[auso-internal]

; ---- Agent to agent ---------------------------------------------------------
exten => _200[1-5],1,NoOp(Internal call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(AUSO_DEST=${EXTEN})
 same => n,Set(AUSO_RECORDING=${UNIQUEID}.wav)
 same => n,Set(CHANNEL(hangup_handler_push)=auso-cdr,s,1)
 ; Server-side recording — the primary mechanism per spec §10. b = only record
 ; once the call is bridged, so ringing isn't in the file.
 same => n,MixMonitor(${RECORDING_DIR}/${AUSO_RECORDING},b)
 ; t/T allow DTMF-initiated transfer by either party in addition to SIP REFER.
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Goto(dial-status-${DIALSTATUS},1)

exten => dial-status-BUSY,1,Busy(10)
exten => dial-status-CHANUNAVAIL,1,Playback(pbx-invalid)
 same => n,Hangup(3)
exten => dial-status-NOANSWER,1,Playback(vm-nobodyavail)
 same => n,Hangup(19)
exten => _dial-status-.,1,Hangup()

; ---- Echo test: confirms two-way audio with a single browser tab ------------
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; ---- Music on hold: confirms inbound audio ---------------------------------
exten => 601,1,NoOp(Music on hold test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,MusicOnHold()

; ---- DTMF test: reads digits back so sendDTMF() is verifiable ---------------
exten => 602,1,NoOp(DTMF test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(digits/1&silence/1)
 same => n,Set(TIMEOUT(digit)=10)
 same => n,Read(DIGITS,beep,4)
 same => n,SayDigits(${DIGITS})
 same => n,Goto(602,5)

; ---- Simulated outbound PSTN call ------------------------------------------
; Dial 9 + any number (e.g. 90772615908) and the "customer" answers.
exten => _9.,1,NoOp(Simulated outbound call to ${EXTEN:1})
 same => n,Set(AUSO_DEST=${EXTEN:1})
 same => n,Set(AUSO_RECORDING=${UNIQUEID}.wav)
 same => n,Set(CHANNEL(hangup_handler_push)=auso-cdr,s,1)
 same => n,MixMonitor(${RECORDING_DIR}/${AUSO_RECORDING})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,MusicOnHold()

; ---- Fall through ----------------------------------------------------------
exten => _X.,1,NoOp(Unknown destination ${EXTEN})
 same => n,Playback(pbx-invalid)
 same => n,Hangup(1)

;==============================================================================
; Simulated inbound customer call
;
; The mock CRM originates a call to an agent over AMI with a spoofed CLI; when
; the agent answers, the "customer" lands here. This exercises the full spec §5
; chain: Asterisk → INVITE → phone → CLI → CRM → customer lookup.
;==============================================================================

[auso-sim-inbound]
exten => s,1,NoOp(Simulated inbound customer connected)
 same => n,Set(AUSO_DEST=${AUSO_AGENT})
 same => n,Set(AUSO_RECORDING=${UNIQUEID}.wav)
 same => n,Set(CHANNEL(hangup_handler_push)=auso-cdr,s,1)
 same => n,MixMonitor(${RECORDING_DIR}/${AUSO_RECORDING})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-thanks)
 same => n,MusicOnHold()
